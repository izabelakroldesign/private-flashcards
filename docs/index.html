<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ee" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Private Flashcards</title>
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      const assetVersion = Date.now().toString();
      const bustParams = new URLSearchParams(window.location.search);
      if (bustParams.has("bust")) {
        window.history.replaceState({}, "", `${window.location.pathname}${window.location.hash}`);
      }
      document.write(`<link rel="stylesheet" href="./styles.css?v=${assetVersion}" />`);
    </script>
  </head>
  <body>
    <div id="app" class="app-shell"></div>
    <input id="json-file" type="file" accept="application/json,.json" hidden />
    <script>
      const script = document.createElement("script");
      script.src = `./app.js?v=${assetVersion}`;
      script.defer = true;
      document.body.appendChild(script);
    </script>
  </body>
</html>
